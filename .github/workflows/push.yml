name: Squzo push sender

# Sends the motivational notifications (and publishes firestore.rules when they change).
# Free on public repositories. GitHub starts scheduled runs very late (we saw 8 hours apart), so each
# run stays on for ~5h50m and checks every 5 minutes; the hourly schedule makes sure a new one takes over.
on:
  schedule:
    - cron: '7 * * * *'
  push:
    branches:
      # main after the default branch is renamed; the old name keeps working until then.
      - main
      - claude/daily-quest-achievement-app-tolstm
    paths:
      - firestore.rules
      - functions/**
      - scripts/push/**
      - .github/workflows/push.yml
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification to every phone now'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: push-sender-${{ inputs.test && 'test' || 'loop' }}
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install sender
        run: npm install --prefix functions --omit=dev --no-audit --no-fund
      - name: Send due notifications
        run: node scripts/push/run.cjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TEST_PUSH: ${{ inputs.test && 'true' || 'false' }}
          LOOP_MINUTES: ${{ inputs.test && '0' || '350' }}
