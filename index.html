<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Plan your week, build habits, track your money and savings goals, and level up every day." />
    <meta name="theme-color" content="#05060b" />
    <script>
      // Apply the saved theme before the app draws, so there's no flash of the wrong colours.
      try {
        var a = JSON.parse(localStorage.getItem('dayforge-appearance') || '{}');
        document.documentElement.dataset.accent = a.accent || 'cyber';
        if (a.accent === 'amber') delete document.documentElement.dataset.accent;
        if (a.background) document.documentElement.dataset.bg = a.background;
      } catch (e) {}
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dayforge" />
    <meta name="application-name" content="Dayforge" />
    <title>Dayforge: Planner, Habits &amp; Money</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
